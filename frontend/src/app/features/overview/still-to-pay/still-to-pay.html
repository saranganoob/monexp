<div class="card card--pad box">
  <div class="between">
    <h2 class="card__title">Still to pay</h2>
    <a class="btn btn--ghost btn--sm" routerLink="/pay">See all bills</a>
  </div>
  @for (row of rows(); track row.b.id) {
    <div class="list-row list-row--tight">
      <div class="info">
        <div class="strong">{{ row.b.name }}</div>
        <div class="due" [class]="'due due--' + row.due.tone">{{ row.due.label }}</div>
      </div>
      <div class="num strong">{{ row.b.amount | inr }}</div>
      <button class="btn btn--sm" (click)="markPaid(row.b)" [appBusy]="'bill:' + row.b.id">{{ store.loading.isPending('bill:' + row.b.id) ? 'Saving…' : (row.b.kind === 'owe' ? 'Mark paid back' : 'Mark paid') }}</button>
    </div>
  } @empty {
    <p class="muted empty">Everything is paid for {{ month().ym | ym }}. Nice.</p>
  }
</div>
