@let x = row();
<div class="line">
  <app-avatar [name]="x.r.name" [tone]="x.avatarTone" />
  <div class="info">
    <div class="strong" [class.muted]="x.done || x.moved">{{ x.r.name }}</div>
    <div class="small muted">{{ x.sub }}</div>
  </div>
  <span class="chip" [class]="'chip chip--' + x.status">{{ x.statusLabel }}</span>
  <div class="num heavy amount">{{ x.r.amount | inr }}</div>
  @if (x.canToggle) {
    <button class="btn btn--sm" [class.btn--primary]="x.btnPrimary" (click)="toggle()">{{ x.btnLabel }}</button>
  }
  <div class="row-flex actions">
    @if (x.canEdit) {
      <button class="btn btn--ghost btn--sm" (click)="edit.emit()" [attr.aria-label]="'Edit ' + x.r.name"><app-icon name="edit" [size]="16" />Edit</button>
    }
    @if (x.canDelete) {
      <button class="btn btn--ghost btn--sm btn--icon-sm" (click)="remove()" [attr.aria-label]="'Delete ' + x.r.name"><app-icon name="trash" [stroke]="1.8" /></button>
    }
  </div>
</div>

@if (editing()) {
  <form class="edit-box editor" [formGroup]="form" (ngSubmit)="save()" (keydown.escape)="closed.emit()">
    <div class="form-grid">
      <label><span class="field-label">Who · what for</span><input class="field" formControlName="name"></label>
      <label><span class="field-label">{{ x.r.planId ? 'Amount this month (₹)' : 'Amount (₹)' }}</span>
        <input [id]="'rowAmt-' + x.r.id" class="field num" inputmode="numeric" formControlName="amount"></label>
      <div class="row-flex">
        <button type="submit" class="btn btn--primary">Save</button>
        <button type="button" class="btn" (click)="closed.emit()">Cancel</button>
      </div>
    </div>
    @if (error()) { <div role="alert" class="err err--sm">{{ error() }}</div> }
  </form>
}
