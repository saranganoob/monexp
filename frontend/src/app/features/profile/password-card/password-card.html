<form class="card panel" [formGroup]="form" (ngSubmit)="save()">
  <div>
    <h2 class="card__title">Change password</h2>
    <p class="card__lead">Use at least 8 characters.</p>
  </div>
  <label><span class="field-label">Current password</span><input type="password" class="field" formControlName="current" autocomplete="current-password"></label>
  <div class="form-grid form-grid--wide">
    <label><span class="field-label">New password</span><input type="password" class="field" formControlName="next" autocomplete="new-password"></label>
    <label><span class="field-label">New password again</span><input type="password" class="field" formControlName="again" autocomplete="new-password"></label>
  </div>
  @if (error()) { <div role="alert" class="err">{{ error() }}</div> }
  <div class="row-flex">
    <button type="submit" class="btn btn--primary" [disabled]="busy()">{{ busy() ? 'Saving…' : 'Change password' }}</button>
    @if (status()) { <span role="status" class="ok-text">{{ status() }}</span> }
  </div>
</form>
