<div class="page">
  <nav class="seg-group profile-tabs" aria-label="Profile sections">
    @for (t of tabs(); track t.path) {
      <a class="seg" [routerLink]="t.path" routerLinkActive="is-on" #rla="routerLinkActive" [attr.aria-current]="rla.isActive ? 'page' : null"
        [class.web-only]="t.webOnly">{{ t.label }}</a>
    }
  </nav>
  <router-outlet />
</div>
