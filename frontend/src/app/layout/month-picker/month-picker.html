<div class="card picker" [class.picker--year]="mode() === 'year'">
  @if (mode() === 'month') {
    <button type="button" class="step" (click)="shift(-1)" aria-label="Previous month"><app-icon name="chevron-left" /></button>
    <span class="divider" aria-hidden="true"></span>
    <label class="choose choose--month">
      <span class="sr">Month</span>
      <select id="mp-month" #m (change)="pickMonth(m.value)">
        @for (name of months; track $index) { <option [value]="$index" [selected]="$index === m0()">{{ name }}</option> }
      </select>
      <app-icon name="chevron-down" [size]="16" />
    </label>
    <span class="divider" aria-hidden="true"></span>
  }
  <label class="choose">
    <span class="sr">Year</span>
    <select id="mp-year" #y (change)="pickYear(y.value)">
      @for (yy of years(); track yy) { <option [value]="yy" [selected]="yy === year()">{{ yy }}</option> }
    </select>
    <app-icon name="chevron-down" [size]="16" />
  </label>
  @if (mode() === 'month') {
    <span class="divider" aria-hidden="true"></span>
    <button type="button" class="step" (click)="shift(1)" aria-label="Next month"><app-icon name="chevron-right" /></button>
  }
</div>
