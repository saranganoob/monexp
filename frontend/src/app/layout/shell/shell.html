<div class="shell">
  <app-sidebar />
  <main class="main">
    <div class="inner">
      <app-top-bar />
      <app-page-header [meta]="meta()" />

      @if (store.loadError()) {
        <div role="alert" class="card load-error">
          {{ store.loadError() }}
          <button class="btn btn--sm" (click)="store.reload()">Try again</button>
        </div>
      }

      @if (store.showSkeleton()) {
        <app-skeleton />
      } @else if (showEmpty()) {
        <app-empty-month />
      } @else {
        <router-outlet />
      }
    </div>
  </main>

  @if (store.dialog()) { <app-add-expense-dialog animate.leave="is-leaving" /> }
  @if (store.emiDialog()) { <app-emi-dialog animate.leave="is-leaving" /> }
  <!-- Screen readers hear "Saving…" when an action takes a while (the toast then says how it went). -->
  <div class="sr" role="status" aria-live="polite">{{ store.loading.anySlow() ? 'Saving…' : '' }}</div>
  <!-- Ask AI only for logins the admin switched AI on for – others never see it. -->
  @if (auth.account()?.aiAllowed) { <app-ask-ai /> }
  <app-undo-toast />
</div>
