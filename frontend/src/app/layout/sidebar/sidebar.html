<nav class="side" aria-label="Main">
  <div class="brand">
    <div class="logo">₹</div>
    <div class="brand-text">
      <div class="brand-name">MonEXP</div>
      <div class="brand-tag">Monthly money, sorted</div>
    </div>
  </div>
  <div class="navlist">
    @for (n of nav; track n.path) {
      <a class="navbtn" [routerLink]="n.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: !!n.exact }"
        #rla="routerLinkActive" [attr.aria-current]="rla.isActive ? 'page' : null">
        <app-icon [name]="n.icon" [size]="20" [stroke]="1.8" />
        <span class="grow">{{ n.label }}</span>
        @if (n.badge && store.unpaidCount()) { <span class="count-badge num">{{ store.unpaidCount() }}</span> }
      </a>
    }
  </div>
  <div class="foot">
    <div class="label">Signed in</div>
    {{ auth.account()?.email || auth.account()?.phone }}
  </div>
</nav>
