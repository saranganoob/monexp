<button type="button" class="chip" [class.is-open]="open()" (click)="toggle()" aria-haspopup="menu" [attr.aria-expanded]="open()"
  [attr.aria-label]="label()" [title]="bills() ? bills()!.month + ': ' + bills()!.paid + ' of ' + bills()!.total + ' bills paid · ' + bills()!.pct + '%' : name()">
  <!-- Always drawn (hidden until there are bills), so a change sweeps round smoothly instead of jumping. -->
  <span class="ring" [class.is-done]="bills()?.done" [class.has-bills]="bills()" aria-hidden="true">
    <svg viewBox="0 0 40 40">
      <circle class="ring__track" cx="20" cy="20" r="18" pathLength="100" />
      <circle class="ring__fill" cx="20" cy="20" r="18" pathLength="100" [style.stroke-dashoffset]="100 - fill()" />
    </svg>
    <span class="avatar">{{ letters() }}</span>
  </span>
  <span class="first">{{ first() }}</span>
  <app-icon class="caret" name="chevron-down" [size]="16" [stroke]="2.2" />
</button>

@if (open()) {
  <div class="menu" role="menu" [attr.aria-label]="name()" (keydown)="keys($event)" animate.leave="is-leaving">
    <div class="who">
      <span class="avatar avatar--lg" aria-hidden="true">{{ letters() }}</span>
      <div class="who__text">
        <div class="who__name">{{ name() }}</div>
        @if (login()) { <div class="who__login">{{ login() }}</div> }
      </div>
    </div>

    <div class="items">
      @if (!inApp) {
        <a role="menuitem" class="item" routerLink="/profile" (click)="close()"><app-icon name="people" [size]="18" />Profile</a>
      }
      <button type="button" role="menuitem" class="item" (click)="toggleMode()">
        <app-icon [name]="theme.mode() === 'dark' ? 'sun' : 'moon'" [size]="18" />{{ theme.mode() === 'dark' ? 'Light mode' : 'Dark mode' }}
      </button>
      <button type="button" role="menuitem" class="item item--out" (click)="signOut()"><app-icon name="sign-out" [size]="18" />Sign out</button>
    </div>
  </div>
}
